name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package-lock.json is committed yet, so use `npm install`.
      # Once you commit a lock file, you can switch this to `npm ci` and add `cache: npm` above.
      - run: npm install
      - run: npm run build
        env:
          # Relative base ('./') is used by default and works under any repository name.
          # To force an absolute base instead, set VITE_BASE: /${{ github.event.repository.name }}/
          VITE_BASE: ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
